# Razer BlackShark V2 Pro (2023), 2.4 GHz dongle — voice chain: EQ, compressor,
# de-esser, limiter. Mono, tuned by ear on 2026-10-12 for a "radio" voice that
# hides a blocked-nose timbre.
#
# Calibrated with the microphone gain at 100 % (ALSA "Mic" 67/67): the gain
# comes before the chain, so another one shifts every threshold.
# The output level is the limiter's "Input gain (dB)", not the compressor's
# makeup: the de-esser's threshold already sits on the plugin's floor (-30 dB)
# and would no longer follow.
{
    nodes = [
        # rumble and plosives under the voice's fundamental (~115 Hz)
        { type = builtin name = hp      label = bq_highpass  control = { "Freq" = 80.0   "Q" = 0.707 } }
        # the low end is left as it is (0 dB): kept as a knob
        { type = builtin name = lo      label = bq_lowshelf  control = { "Freq" = 170.0  "Q" = 0.707 "Gain" = 0.0 } }
        # nasal voice: two bumps measured around 750 Hz and 1.5 kHz
        { type = builtin name = nas1    label = bq_peaking   control = { "Freq" = 750.0  "Q" = 1.4   "Gain" = -3.0 } }
        { type = builtin name = nas2    label = bq_peaking   control = { "Freq" = 1500.0 "Q" = 2.0   "Gain" = -3.0 } }
        # some clarity in the dip measured around 2 kHz
        { type = builtin name = clar    label = bq_peaking   control = { "Freq" = 2200.0 "Q" = 1.2   "Gain" = 2.0 } }
        # the "duck" side, at 1 kHz
        { type = builtin name = k1      label = bq_peaking   control = { "Freq" = 1050.0 "Q" = 1.5   "Gain" = -3.0 } }
        # presence: what hides the blocked nose best (listening test)
        { type = builtin name = pres3k  label = bq_peaking   control = { "Freq" = 3200.0 "Q" = 0.8   "Gain" = 6.0 } }
        # low mids scooped at 400 Hz
        { type = builtin name = mid     label = bq_peaking   control = { "Freq" = 400.0  "Q" = 1.0   "Gain" = -3.0 } }
        # highs too forward above 7 kHz
        { type = builtin name = hi      label = bq_highshelf control = { "Freq" = 7000.0 "Q" = 0.707 "Gain" = -1.0 } }
        # +9 dB into the compressor, whose threshold stops at -30 dB
        { type = builtin name = pre     label = linear       control = { "Mult" = 2.818 "Add" = 0.0 } }
        # compressor: a slow attack (20 ms) lets the start of each word through
        { type = ladspa  name = comp    plugin = sc4m_1916   label = sc4m
          control = { "RMS/peak" = 0.4 "Attack time (ms)" = 20.0 "Release time (ms)" = 90.0
                      "Threshold level (dB)" = -28.0 "Ratio (1:n)" = 3.5 "Knee radius (dB)" = 6.0 "Makeup gain (dB)" = 10.0 } }
        # de-esser: split at 4 kHz (Linkwitz-Riley, two biquads a side), only
        # the high band is compressed
        { type = builtin name = lp1     label = bq_lowpass   control = { "Freq" = 4000.0 "Q" = 0.7071 } }
        { type = builtin name = lp2     label = bq_lowpass   control = { "Freq" = 4000.0 "Q" = 0.7071 } }
        { type = builtin name = hp1     label = bq_highpass  control = { "Freq" = 4000.0 "Q" = 0.7071 } }
        { type = builtin name = hp2     label = bq_highpass  control = { "Freq" = 4000.0 "Q" = 0.7071 } }
        { type = ladspa  name = deess   plugin = sc4m_1916   label = sc4m
          control = { "RMS/peak" = 0.0 "Attack time (ms)" = 1.5 "Release time (ms)" = 60.0
                      "Threshold level (dB)" = -30.0 "Ratio (1:n)" = 10.0 "Knee radius (dB)" = 3.0 "Makeup gain (dB)" = 0.0 } }
        { type = builtin name = sum     label = mixer        control = { "Gain 1" = 1.0 "Gain 2" = 1.0 } }
        # safety limiter: nothing above -1 dBFS. A stereo plugin, one side wired.
        { type = ladspa  name = lim     plugin = fast_lookahead_limiter_1913 label = fastLookaheadLimiter
          control = { "Input gain (dB)" = -6.5 "Limit (dB)" = -1.0 "Release time (s)" = 0.2 } }
    ]
    links = [
        { output = "hp:Out"       input = "lo:In" }
        { output = "lo:Out"       input = "nas1:In" }
        { output = "nas1:Out"     input = "nas2:In" }
        { output = "nas2:Out"     input = "clar:In" }
        { output = "clar:Out"     input = "k1:In" }
        { output = "k1:Out"       input = "pres3k:In" }
        { output = "pres3k:Out"   input = "mid:In" }
        { output = "mid:Out"      input = "hi:In" }
        { output = "hi:Out"       input = "pre:In" }
        { output = "pre:Out"      input = "comp:Input" }
        { output = "comp:Output"  input = "lp1:In" }
        { output = "comp:Output"  input = "hp1:In" }
        { output = "lp1:Out"      input = "lp2:In" }
        { output = "hp1:Out"      input = "hp2:In" }
        { output = "hp2:Out"      input = "deess:Input" }
        { output = "lp2:Out"      input = "sum:In 1" }
        { output = "deess:Output" input = "sum:In 2" }
        { output = "sum:Out"      input = "lim:Input 1" }
    ]
    inputs  = [ "hp:In" ]
    outputs = [ "lim:Output 1" ]
}
